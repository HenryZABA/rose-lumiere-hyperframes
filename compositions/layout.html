</section></div></div><script>const tl=gsap.timeline({paused:true});const feed=document.querySelector('#feed');

const clock={time:0};
function fill(time){
  for(const e of entries){
    const ratio=Math.max(0,Math.min(1,(time-e.start)/(e.end-e.start)));
    e.el.hidden=time<e.start;
    const next=e.text.slice(0,Math.floor(ratio*e.text.length));
    if(e.typed.textContent!==next)e.typed.textContent=next;
    e.caret.hidden=ratio>=1;
    e.file.hidden=ratio<1;
  }
}
const scrollSteps=[];
function measureScroll(){
  scrollSteps.length=0;
  let previous=0;
  for(let frame=0;frame<=660;frame++){
    const time=frame/30;
    fill(time);
    const offset=Math.max(0,feed.offsetHeight-feed.parentElement.clientHeight);
    if(offset!==previous)scrollSteps.push({time,delta:offset-previous});
    previous=offset;
  }
  paint();
}
function paint(){
  fill(clock.time);
  let offset=0;
  for(const step of scrollSteps){
    const u=Math.max(0,Math.min(1,(clock.time-step.time)/.24));
    offset+=step.delta*u*u*(3-2*u);
  }
  feed.style.transform='translateY(-'+offset+'px)';
}
document.fonts.ready.then(measureScroll);
